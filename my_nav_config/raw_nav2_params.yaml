controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 10.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      
      # ----- 速度参数（轴距短，惯性小，可以稍快）-----
      desired_linear_vel: 0.5
      max_angular_vel: 1.5
      min_approach_velocity: 0.10
      
      # ----- 前瞻距离（短轴距需要更小的前瞻）-----
      lookahead_dist: 0.35        # 原来0.6太大，过弯会切内线
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: true
      
      # ===== 阿克曼核心约束（匹配你的车）=====
      min_turning_radius: 0.32      # ← 根据轴距计算得出
      use_rotate_to_heading: false
      allow_reversing: true
      
      # ----- 速度缩放 -----
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_speed: 0.2
      regulated_linear_scaling_min_radius: 0.3   # 小于这个半径开始减速
      use_fixed_curvature_lookahead: true
      curvature_lookahead_dist: 0.25
      
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 13.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.20, 0.10], [0.20, -0.10], [-0.12, -0.10], [-0.12, 0.10]]"
      
      # 插件列表（声明要用哪些插件）
      plugins: ["voxel_layer", "inflation_layer"]
      
      # ===== voxel_layer 配置（独立块）=====
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.8
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.18
          obstacle_max_range: 2.5
          obstacle_min_range: 0.18
      
      # ===== inflation_layer 配置（独立块）=====
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.2
        inflation_radius: 0.35
      
      # ===== static_layer 配置（独立块）=====
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 4.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      footprint: "[[0.20, 0.10], [0.20, -0.10], [-0.12, -0.10], [-0.12, 0.10]]"
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.18
          obstacle_max_range: 2.5
          obstacle_min_range: 0.18
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.2
        inflation_radius: 0.35
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 3.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      reverse_penalty: 1.0   # 倒车惩罚
      change_penalty: 1.5 # 转弯惩罚
      non_straight_penalty: 1.5  # 不直行惩罚
      cost_penalty: 1.8  # 障碍物惩罚
      tolerance: 0.2
      use_astar: false
      allow_unknown: true
      minimum_turning_radius: 0.32
      angle_quantization_bins: 128

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    use_sim_time: true
    simulate_ahead_time: 0.5
    max_rotational_vel: 1.5
    min_rotational_vel: 0.4
    rotational_acc_lim: 5.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 30.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.2]
    min_velocity: [-0.5, 0.0, -1.2]
    max_accel: [2.5, 0.0, 3.0]      # 转向加速度3.0足够
    max_decel: [-3.5, 0.0, -4.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""